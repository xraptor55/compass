<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compass</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="compass-container">

  <div id="compass">

    <!-- white inner disk -->
    <div id="inner-disk"></div>

    <!-- labels -->
    <div class="label n">N</div>
    <div class="label ne">NE</div>
    <div class="label e">E</div>
    <div class="label se">SE</div>
    <div class="label s">S</div>
    <div class="label sw">SW</div>
    <div class="label w">W</div>
    <div class="label nw">NW</div>

    <!-- center pivot -->
    <div id="pivot"></div>

    <!-- needle -->
    <div id="needle"></div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
